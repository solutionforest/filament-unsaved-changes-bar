name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['^4.0', '^5.0']
        exclude:
          - php: '8.2'
            filament: '^5.0'
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer require "filament/filament:${{ matrix.filament }}" -W --no-interaction --no-progress
      - run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer analyse
      - run: composer format -- --test
