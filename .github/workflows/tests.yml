name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: Pest · PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, gd
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress
      - run: composer test

  quality:
    runs-on: ubuntu-latest
    name: Larastan + Pint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer analyse
      - run: composer format -- --test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ['php-server', 'octane-swoole']
    name: Browser (Playwright) · ${{ matrix.server }}
    env:
      DEMO_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd, swoole
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: composer update --no-interaction --no-progress
      - name: Build and start the demo app
        run: |
          composer demo:build
          if [ "${{ matrix.server }}" = "octane-swoole" ]; then
            nohup vendor/bin/testbench octane:start --server=swoole --host=127.0.0.1 --port=8000 --workers=2 > demo-server.log 2>&1 &
          else
            PHP_CLI_SERVER_WORKERS=4 nohup vendor/bin/testbench serve --host=127.0.0.1 --port=8000 > demo-server.log 2>&1 &
          fi
          echo $! > demo-server.pid
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$DEMO_URL/admin/login" && exit 0; sleep 1; done
          cat demo-server.log; exit 1
      - name: Install Playwright
        working-directory: demo/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: demo/e2e
        env:
          CI: true
        run: npx playwright test
      - name: Stop the demo app
        if: always()
        run: kill "$(cat demo-server.pid)" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            demo/e2e/playwright-report
            demo/e2e/test-results
            demo-server.log
          retention-days: 7
